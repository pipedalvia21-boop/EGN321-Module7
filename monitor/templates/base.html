<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lab temperature monitor{% endblock %}</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --line: #d5dbe1; --ink: #1d2733; --muted: #5b6874;
    --healthy: #1f7a5a; --degraded: #9a5b00; --failed: #b3261e; --starting: #2f5d9e;
    --alert: #b3261e; --ok-soft: #e4f2ec; --warn-soft: #fbefdc; --bad-soft: #f8e3e1; --info-soft: #e3ebf6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  header.top { display: flex; align-items: center; gap: 24px; padding: 14px 24px; background: var(--panel);
               border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header.top h1 { font-size: 18px; margin: 0; font-weight: 650; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 18px; padding-bottom: 3px; }
  nav a.on { color: var(--ink); border-bottom: 2px solid var(--ink); }
  header.top .clock { margin-left: auto; color: var(--muted); }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; font-weight: 650; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); }
  td.num, th.num { text-align: right; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12.5px; font-weight: 600; }
  .tag.OK, .tag.INFO { background: var(--ok-soft); color: var(--healthy); }
  .tag.SUSPICIOUS, .tag.WARNING { background: var(--warn-soft); color: var(--degraded); }
  .tag.OUT_OF_RANGE, .tag.FAULT, .tag.MISSING, .tag.ERROR, .tag.CRITICAL { background: var(--bad-soft); color: var(--failed); }
  .chart svg { width: 100%; height: auto; display: block; }
  a { color: var(--starting); }
  @media (max-width: 760px) { header.top { padding: 12px 16px; } main { padding: 14px 12px 32px; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <h1>Lab temperature monitor</h1>
  <nav>
    <a href="/" class="{{ 'on' if request.path == '/' }}">Live</a>
    <a href="/history" class="{{ 'on' if request.path == '/history' }}">History</a>
    <a href="/logs" class="{{ 'on' if request.path == '/logs' }}">Logs</a>
  </nav>
  <span class="clock small num" id="clock">{% block clock %}{% endblock %}</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
